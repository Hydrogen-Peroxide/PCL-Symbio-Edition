name: Publish (Beta)

permissions:
  contents: read

on:
  release:
    types: [published]

jobs:
  build:
    if: ${{ github.event.release.prerelease }}
    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: Beta
      architecture: x64
    secrets: inherit

  changelog:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    if: ${{ github.event.release.prerelease }}
    steps:
      - name: Checkout all
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate changelog
        run: git-cliff --latest -o CHANGELOG.md

      - name: Add changelog to release
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rename_and_release:
    permissions:
      contents: write
    needs: [build, changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: PCL2_CE_Beta_x64
          path: ./artifact

      - name: Rename binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET_NAME="PCL-Symbio-Edition-${VERSION}-x64.exe"
          mv "./artifact/Plain Craft Launcher 2.exe" "$ASSET_NAME"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"

      - name: Upload binary to Release
        uses: softprops/action-gh-release@v2.2.2
        with:
          fail_on_unmatched_files: true
          files: ${{ env.ASSET_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync_cnb:
    # 附件都传到 GitHub Release 之后，整体镜像一份到 CNB（含预发布标记）
    needs: [rename_and_release]
    permissions:
      contents: read
    uses: ./.github/workflows/sync-cnb-release.yml
    with:
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit
